name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend 2
        run: |
          curl -fsSL https://bend-lang.com/install.sh | sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Show compiler version
        run: bend --version
      - name: Check proofs and test JS and native CPU backends
        run: ./scripts/test.sh --native

  benchmark-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark Python dependencies
        run: python -m pip install -r benchmark/requirements.txt
      - name: Validate benchmark data and correctness checks
        run: python -m unittest discover -s benchmark -p 'test_*.py'
